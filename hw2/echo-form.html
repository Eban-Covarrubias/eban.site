<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW2 Echo Form</title>
  <meta name="description" content="Shared echo-service test form for CSE 135 HW2">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>Echo Form</h1>
    <p>Pick a language, HTTP method, and encoding, then submit to see your data echoed back by the server.</p>
  </header>

  <main>
    <a class="back-link" href="/hw2/index.html">&larr; Back to HW2</a>

    <noscript>
      <p><strong>JavaScript is off.</strong> This form falls back to a plain POST
      (application/x-www-form-urlencoded) to the PHP echo endpoint below &mdash;
      the language/method/encoding pickers only take effect with script enabled.</p>
    </noscript>

    <form id="echo-form" method="post" action="/hw2/php/echo-php.php">
      <p>
        <label>Language:
          <select id="language" name="language">
            <option value="php">PHP</option>
            <option value="python">Python</option>
            <option value="node">Node.js (Express)</option>
          </select>
        </label>
      </p>
      <p>
        <label>Method:
          <select id="method" name="method">
            <option value="GET">GET</option>
            <option value="POST" selected>POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
          </select>
        </label>
      </p>
      <p>
        <label>Encoding:
          <select id="encoding" name="encoding">
            <option value="urlencoded">application/x-www-form-urlencoded</option>
            <option value="json">application/json</option>
          </select>
        </label>
      </p>
      <p><label>Message: <input type="text" id="message" name="message" value="Hello from the echo form"></label></p>
      <p><label>Name: <input type="text" id="name" name="name" value="Eban"></label></p>
      <button type="submit">Send</button>
    </form>

    <h2>Response</h2>
    <pre id="echo-result" style="white-space:pre-wrap;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:1rem;">(submit the form to see a response here)</pre>
  </main>

  <footer>
    <p>Hosted on <a href="https://eban.site">eban.site</a> &middot; CSE 135</p>
  </footer>

  <script src="/hw2/js/echo-form.js"></script>
</body>
</html>
